{% extends "base.html" %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-page">
    <div id="particles-js"></div>
    
    <div class="auth-card" data-aos="zoom-in" data-aos-duration="500">
        <div class="auth-header">
            <div class="auth-logo">🚀 CareerPilot <span class="text-gradient">AI</span></div>
            <p>Welcome back! Please login to your account.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username or email" required autofocus>
            </div>
            
            <div class="form-group">
                <div class="flex-between" style="margin-bottom: 0.5rem;">
                    <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="font-size: 0.8rem;">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Log In
            </button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up for free</a>
        </div>
    </div>
</div>
{% endblock %}
