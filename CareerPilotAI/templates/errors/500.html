{% extends "base.html" %}

{% block title %}500 - Server Error | {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-panel text-center p-5" data-aos="zoom-in">
        <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
        <h3 class="mb-4">Internal Server Error</h3>
        <p class="text-muted mb-5">Oops, something went wrong on our end. Our AI engineers have been notified.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <button onclick="window.location.reload()" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </button>
            <a href="{{ url_for('home') }}" class="btn btn-outline-light rounded-pill px-4">
                <i class="bi bi-house-door me-2"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
