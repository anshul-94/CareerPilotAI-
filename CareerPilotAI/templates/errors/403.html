{% extends "base.html" %}

{% block title %}403 - Forbidden | {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-panel text-center p-5" data-aos="zoom-in">
        <h1 class="display-1 fw-bold text-warning mb-3">403</h1>
        <h3 class="mb-4">Access Forbidden</h3>
        <p class="text-muted mb-5">You don't have permission to access this resource. Please log in with appropriate credentials.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </a>
            <a href="{{ url_for('home') }}" class="btn btn-outline-light rounded-pill px-4">
                <i class="bi bi-house-door me-2"></i>Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
