{% extends "base.html" %}

{% block title %}404 - Page Not Found | {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-panel text-center p-5" data-aos="zoom-in">
        <h1 class="display-1 fw-bold text-gradient mb-3">404</h1>
        <h3 class="mb-4">Page Not Found</h3>
        <p class="text-muted mb-5">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('home') }}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house-door me-2"></i>Go Home
            </a>
            <button onclick="window.history.back()" class="btn btn-outline-light rounded-pill px-4">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
