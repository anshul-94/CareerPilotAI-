{% extends "base.html" %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-page">
    <div id="particles-js"></div>
    
    <div class="auth-card" data-aos="zoom-in" data-aos-duration="500">
        <div class="auth-header">
            <div class="auth-logo">🚀 CareerPilot <span class="text-gradient">AI</span></div>
            <p>Create your free account to supercharge your career.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-input" placeholder="John Doe" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="johndoe" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="john@example.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required minlength="6">
                <div class="form-hint">Must be at least 6 characters long.</div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm your password" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Create Account
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
